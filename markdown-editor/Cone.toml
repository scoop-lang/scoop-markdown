schema = 1
[cone]
group = "scoop.examples"
name = "markdown-editor"
version = "0.1.0"
kind = "executable"
description = "Native Markdown editor with source, rich text and side-by-side views"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scoop-lang/scoop-markdown"
readme = "README.md"

[windows]
subsystem = "gui"
rc = "packaging/windows.rc"

[bundle]
config = "Bundle.toml"

[[sources]]
path = "src"
[[sources]]
path = "platform/darwin"
when = { os = "darwin" }
[[sources]]
path = "platform/windows"
when = { os = "windows" }
[[sources]]
path = "platform/linux"
when = { os = "linux", env = "gnu" }

[dependencies]
"scoop:scoop.graphics" = "0.1.0"
"scoop:scoop.graphics.text" = "0.1.0"
"scoop:scoop.graphics.svg" = "0.1.0"
"scoop:scoop.icons.lucide" = "0.1.0"
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.concurrent" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.markdown" = { version = "0.1.0", path = "../scoop.markdown" }
"scoop:scoop.ui.markdown" = { version = "0.1.0", path = "../scoop.ui.markdown" }
"scoop:scoop.ui" = "0.1.0"
"scoop:scoop.ui.component" = "0.1.0"
"scoop:scoop.ui.style" = "0.1.0"
"scoop:scoop.ui.style.shadcn" = "0.1.0"
"scoop:scoop.window" = "0.1.0"
"scoop:scoop.surface" = "0.1.0"
"scoop:scoop.url" = "0.1.0"
"scoop:scoop.json" = "0.1.0"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"
